[tasks."prepare:scalar_smoke_v3"]
description = "Populate the scalar_smoke_v3 new-family smoke table (10k rows, no tier variants)"
depends = ["postgres", "bench:build"]
run = """
#!/usr/bin/env bash
set -e
CURRENT=$(psql -U postgres -d postgres -tAc "SELECT COUNT(*) FROM scalar_smoke_v3;")
TARGET="${1:-10000}"
if [ "$CURRENT" -ge "$TARGET" ]; then
  echo "scalar_smoke_v3 already has $CURRENT rows (>= $TARGET)."
  exit 0
fi
NUM_RECORDS=$((TARGET - CURRENT)) ./target/release/encrypt_scalar_smoke_v3
"""

[tasks."prepare:v3:all"]
description = "Prepare every v3 encrypted table at the given tier (default 10000)"
run = """
#!/usr/bin/env bash
set -e
TIER="${1:-10000}"
for t in string_encrypted_v3 integer_encrypted_v3 integer_encrypted_ope_v3 category_encrypted_v3 combo_encrypted_v3 json_ste_vec_small_v3; do
  mise run "prepare:$t" "$TIER"
done
mise run prepare:scalar_smoke_v3
"""

[tasks."prepare:category_plaintext"]
description = "Prepare category_plaintext_<size> table with ~250 low-cardinality categorical strings (CAT_001..CAT_250, uniform random)"
depends = ["postgres"]
run = """
#!/usr/bin/env bash
set -e

TARGET_ROWS="$1"

if [ -z "$TARGET_ROWS" ]; then
  echo "Error: target row count argument required"
  echo "Usage: mise run prepare:category_plaintext <target_rows>"
  exit 1
fi

case "$TARGET_ROWS" in
  10000|100000|1000000|10000000)
    ;;
  *)
    echo "Error: TARGET_ROWS must be one of: 10000, 100000, 1000000, 10000000"
    exit 1
    ;;
esac

TABLE_NAME="category_plaintext_${TARGET_ROWS}"

echo "Waiting for PostgreSQL to be ready..."
until pg_isready -U postgres > /dev/null 2>&1; do
  sleep 1
done

CURRENT_ROWS=$(psql -U postgres -d postgres -t -c "SELECT COUNT(*) FROM $TABLE_NAME;" | tr -d ' ')

echo "Current rows in $TABLE_NAME: $CURRENT_ROWS"
echo "Target rows: $TARGET_ROWS"

if [ "$CURRENT_ROWS" -ge "$TARGET_ROWS" ]; then
  echo "Table already has $CURRENT_ROWS rows (>= $TARGET_ROWS). No action needed."
  exit 0
fi

ROWS_TO_INSERT=$((TARGET_ROWS - CURRENT_ROWS))
echo "Inserting $ROWS_TO_INSERT random category values (CAT_001..CAT_250, uniform)..."

# `format('CAT_%s', lpad(((random()*249)::int + 1)::text, 3, '0'))` matches the
# Rust FakeCategory output `format!("CAT_{:03}", n)`. 250 distinct buckets.
psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "
  INSERT INTO $TABLE_NAME (value)
  SELECT 'CAT_' || lpad(((random() * 249)::int + 1)::text, 3, '0')
  FROM generate_series(1, $ROWS_TO_INSERT) g;
"

FINAL_ROWS=$(psql -U postgres -d postgres -t -c "SELECT COUNT(*) FROM $TABLE_NAME;" | tr -d ' ')
echo "Preparation complete! Final row count: $FINAL_ROWS"
"""

[tasks."prepare:integer_plaintext"]
description = "Prepare integer_plaintext_<size> table (random ints, btree) — plaintext baseline for ORE/OPE range scenarios"
depends = ["postgres"]
run = """
#!/usr/bin/env bash
set -e
TARGET_ROWS="$1"
case "$TARGET_ROWS" in
  10000|100000|1000000|10000000) ;;
  *) echo "Error: TARGET_ROWS must be one of: 10000, 100000, 1000000, 10000000"; exit 1 ;;
esac
TABLE_NAME="integer_plaintext_${TARGET_ROWS}"
until pg_isready -U postgres > /dev/null 2>&1; do sleep 1; done
CURRENT_ROWS=$(psql -U postgres -d postgres -tAc "SELECT COUNT(*) FROM $TABLE_NAME;")
if [ "$CURRENT_ROWS" -ge "$TARGET_ROWS" ]; then
  echo "$TABLE_NAME already has $CURRENT_ROWS rows (>= $TARGET_ROWS)."
  psql -U postgres -d postgres -c "CREATE INDEX IF NOT EXISTS ${TABLE_NAME}_value_idx ON $TABLE_NAME (value);"
  exit 0
fi
ROWS_TO_INSERT=$((TARGET_ROWS - CURRENT_ROWS))
echo "Inserting $ROWS_TO_INSERT rows into $TABLE_NAME..."
# Same distribution as the encrypted integer bench: uniform over the full
# i32 range (Faker.fake::<i32>()).
psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "
  INSERT INTO $TABLE_NAME (value)
  SELECT (floor(random() * 4294967296) - 2147483648)::int
  FROM generate_series(1, $ROWS_TO_INSERT);"
psql -U postgres -d postgres -c "CREATE INDEX IF NOT EXISTS ${TABLE_NAME}_value_idx ON $TABLE_NAME (value);"
psql -U postgres -d postgres -c "ANALYZE $TABLE_NAME;"
echo "Preparation complete."
"""

