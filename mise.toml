[tasks."bench:v3:query:_run"]
description = "Internal: run one v3 query bench (prepare deps, clean criterion group, write results under results/query/v3/)"
run = """
#!/usr/bin/env bash
set -e

# Signature: <bench> <group> [prepare tasks...] <target_rows>
# TARGET_ROWS comes LAST: the per-family wrapper tasks are single-line
# commands, and mise appends caller args to those — so the tier the user
# passes lands at the end of the arg list.
BENCH_NAME="$1"     # cargo bench target, e.g. exact_v3
GROUP="$2"          # criterion group to clean, e.g. EXACT
shift 2

# All-but-last args are prepare task names; the last is the tier.
PREPS=""
while [ $# -gt 1 ]; do
  PREPS="$PREPS $1"
  shift
done
TARGET_ROWS="${1:-}"

if [ -z "$BENCH_NAME" ] || [ -z "$GROUP" ] || [ -z "$TARGET_ROWS" ]; then
  echo "Usage: mise run bench:v3:query:_run <bench> <group> [prepare tasks...] <target_rows>"
  exit 1
fi
if ! [[ "$TARGET_ROWS" =~ ^[0-9]+$ ]]; then
  echo "Error: target row count must be a positive integer"
  exit 1
fi

for prep in $PREPS; do
  echo "Preparing via prepare:$prep..."
  mise run "prepare:$prep" "$TARGET_ROWS"
done

echo "Cleaning old criterion data for $GROUP..."
rm -rf "target/criterion/data/main/$GROUP" "target/criterion/reports/$GROUP"

echo "Running $BENCH_NAME query benchmark..."
mkdir -p results/query/v3
OUTPUT_FILE="results/query/v3/${BENCH_NAME%_v3}_rows_${TARGET_ROWS}.json"
TARGET_ROWS="$TARGET_ROWS" cargo criterion --bench "$BENCH_NAME" --message-format json > "$OUTPUT_FILE"

echo "Benchmark complete! Results written to $OUTPUT_FILE"
"""

