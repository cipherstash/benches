[package]
name = "dbbenches"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
sqlx = { version = "0.8", features = [ "runtime-tokio-native-tls" , "postgres", "json" ] }
tokio = { version = "1.47.1", features = ["full"] }
criterion = { version = "0.4.0", features = [ "async_tokio" ]}
criterion-table = "0.4.2"
ore-rs = "0.7.0"
hex = "0.4.3"
hex-literal = "0.3.4"
rand = "0.8.5"
# cipherstash-client + stack-profile ship from the same cipherstash-suite
# workspace and must stay version-locked — cipherstash-client implements
# `KeyProvider` for stack-profile's `ProfileStore`, so a source/version
# mismatch produces two incompatible `ProfileStore` types. 0.38.1 keeps the
# EQL v2 wire payloads (`k`/`c`/`v`/`i`) byte-identical to the
# 0.34.1-alpha.9 pre-release that EQL 2.3.0 targets — the eql wire formats
# module is unchanged between the two — so the EQL release pin in
# mise.toml's setup-db task stays at eql-2.3.0. 0.38.1 adds scalar
# OPE-CLLW `op` term emission via `Index::new_ope()` (CIP-3280), which the
# `_ord_ope` benches require (real OPE ciphertexts). Bump both together.
cipherstash-client = { version = "=0.38.1", features = ["tokio"] }
stack-profile = "=0.38.1"
# EQL v2.3 -> v3 payload conversion (the supported migration path; the
# converter's docs name these benches as a consumer). eql-bindings::from_v2
# reshapes the client's v2.3 payloads into the eql_v3 domain payloads.
# Published on crates.io as of 0.4.2 (was a git dep on the eql_v3 branch).
eql-bindings = "=0.4.2"
# Plaintext::Decimal takes rust_decimal::Decimal, which cipherstash-client
# does not re-export — used by the scalar_smoke_v3 numeric-family coverage.
rust_decimal = "1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
fake = { version = "4.4.0", features = ["chrono"] }
# tracing-subscriber wires up the cipherstash-client / zerokms-protocol
# trace! emissions to stderr when RUST_LOG is set. Without a subscriber
# the trace calls are no-ops; with one, RUST_LOG=cipherstash_client=trace
# (etc.) surfaces the rich ViturRequestError display from the inner
# trace! at vitur_client::generate_keys.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

