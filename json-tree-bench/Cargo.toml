[package]
name = "json-tree-bench"
version = "0.1.0"
edition = "2021"
publish = false

# A crate of its own, not a target of the root `dbbenches` package: the root
# pins cipherstash-client 0.38.1, which compiles only against
# zerokms-protocol 0.12.20, while stack-encrypt's stack-kms needs
# zerokms-protocol >= 0.12.31 — one 0.12.x can be selected per build, so
# the two clients cannot share a dependency graph. The root package is not
# a workspace, so this directory resolves on its own (own Cargo.lock, own
# target/). The handful of result-shape helpers it shares with the root
# (ScenarioMetadata, the metadata sidecar, bench_assert) are copied into
# src/lib.rs so the results slot into the same report tooling.

[dependencies]
# stack-encrypt's JSON index (the EQL v4 `json_tree` family) and the EQL
# v4 wire types that put `v`/`i` on a stored document and type the query
# operands, from the stack monorepo until they ship. `default-features =
# false` on stack-encrypt drops the HTTP/ZeroKMS transport: the benches seal
# and derive terms under `DeterministicSource` (feature `test-support`),
# because what is measured is Postgres, not a KMS round-trip.
#
# Two stored formats are built from one crate, one per feature, each pinned
# to the stack commit it measures (a `rev`, not a branch, so a measurement
# names its code):
#
#   derivable (default)  cipherstash/stack#1363, `feat/json-tree-derivable-tokens`:
#                        every entry carries a self tag `x`, a member's token
#                        drops its ordinal, and a read is
#                        `json_tree_subtree(doc, tokens text[], budget)`.
#   gates                its base, `docs/json-tree-derivable-tokens` (code-identical
#                        to #1358): a read is a head token plus one gate per
#                        step, `json_tree_subtree_at(doc, token, gates, budget)`.
#
# The features are exclusive. Each package is renamed so the two copies of
# the stack tree resolve side by side in one Cargo.lock; the crate imports
# them under their usual names (`extern crate .. as stack_encrypt` in each
# target, see src/lib.rs). Build the base format with
# `--no-default-features --features gates` into its own target dir
# (`JSON_TREE_FORMAT=gates` does this in the mise tasks).
stack-encrypt-derivable = { package = "stack-encrypt", git = "https://github.com/cipherstash/stack", rev = "683802bccd56f828ebb8c1a325bbca9077d0e456", default-features = false, features = ["test-support"], optional = true }
eql-bindings-derivable = { package = "eql-bindings", git = "https://github.com/cipherstash/stack", rev = "683802bccd56f828ebb8c1a325bbca9077d0e456", default-features = false, features = ["stack-encrypt"], optional = true }
stack-encrypt-gates = { package = "stack-encrypt", git = "https://github.com/cipherstash/stack", rev = "edabee625de2777131a919fcf5484e7333e607de", default-features = false, features = ["test-support"], optional = true }
eql-bindings-gates = { package = "eql-bindings", git = "https://github.com/cipherstash/stack", rev = "edabee625de2777131a919fcf5484e7333e607de", default-features = false, features = ["stack-encrypt"], optional = true }
# merged: the derivable format as #1363 merged to `next` (ebdb5de0a, with
# #1358, #1362, #1363 and #1366 on it): the same stored bytes and tokens as
# `derivable`, with f94a6eb11's SQL (inlined chain primitives, one read
# index) and the review fixes after 683802bcc. Build with
# `--no-default-features --features merged` into json-tree-bench/target-merged.
stack-encrypt-merged = { package = "stack-encrypt", git = "https://github.com/cipherstash/stack", rev = "ebdb5de0a12bbec06842851eece283fb7faea30b", default-features = false, features = ["test-support"], optional = true }
eql-bindings-merged = { package = "eql-bindings", git = "https://github.com/cipherstash/stack", rev = "ebdb5de0a12bbec06842851eece283fb7faea30b", default-features = false, features = ["stack-encrypt"], optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "json"] }
tokio = { version = "1.47.1", features = ["full"] }
criterion = { version = "0.4.0", features = ["async_tokio"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fake = { version = "4.4.0", features = ["chrono"] }

[features]
default = ["derivable"]
derivable = ["dep:stack-encrypt-derivable", "dep:eql-bindings-derivable"]
gates = ["dep:stack-encrypt-gates", "dep:eql-bindings-gates"]
merged = ["dep:stack-encrypt-merged", "dep:eql-bindings-merged"]

[[bin]]
name = "encrypt_json_tree_v4"
path = "src/bin/encrypt_json_tree_v4.rs"

[[bin]]
name = "encrypt_json_tree_large_v4"
path = "src/bin/encrypt_json_tree_large_v4.rs"

[[bin]]
name = "encrypt_json_tree_extra_v4"
path = "src/bin/encrypt_json_tree_extra_v4.rs"

[[bin]]
name = "dt_bench"
path = "src/bin/dt_bench.rs"

[[bench]]
name = "json_tree_v4"
harness = false

[[bench]]
name = "json_tree_nested_v4"
harness = false

[[bin]]
name = "check_json_tree_v4"
path = "src/bin/check_json_tree_v4.rs"
